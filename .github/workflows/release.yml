name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: testes antes de publicar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Fumaça
        shell: bash
        run: |
          mkqr -V
          mkqr https://github.com/berodcdev/mkqr -O smoke.png
          test -s smoke.png

  build:
    name: monta wheel e sdist
    needs: test
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: A tag bate com __version__?
        id: versao
        run: |
          VERSAO="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/mkqr/__init__.py').read_text()).group(1))")"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSAO" ]; then
            echo "::error::a tag ${GITHUB_REF_NAME} não bate com __version__ = $VERSAO"
            exit 1
          fi
          echo "versão: $VERSAO"
      - run: pip install build
      - run: python -m build
      - name: Confere os artefatos
        run: |
          pip install twine
          twine check dist/*
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Notas a partir do CHANGELOG
        run: |
          python - <<'PY' > NOTAS.md
          import pathlib, re
          v = "${{ needs.build.outputs.versao }}"
          texto = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"^## \[{re.escape(v)}\].*?$(.*?)(?=^## \[|\Z)", texto, re.S | re.M)
          print((m.group(1).strip() if m else "Veja o CHANGELOG.md.") + "\n")
          PY
          cat NOTAS.md
      - name: Publica o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file NOTAS.md \
            --verify-tag

  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mkqr/
    permissions:
      id-token: write   # Trusted Publishing (OIDC): sem token guardado no repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
