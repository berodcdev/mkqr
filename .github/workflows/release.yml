name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: testes antes de publicar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Fumaça
        shell: bash
        run: |
          mkqr -V
          mkqr https://github.com/berodcdev/mkqr -O smoke.png
          test -s smoke.png

  build:
    name: monta wheel e sdist
    needs: test
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: A tag bate com __version__?
        id: versao
        run: |
          VERSAO="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/mkqr/__init__.py').read_text()).group(1))")"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSAO" ]; then
            echo "::error::a tag ${GITHUB_REF_NAME} não bate com __version__ = $VERSAO"
            exit 1
          fi
          echo "versão: $VERSAO"
      - run: pip install build
      - run: python -m build
      - name: Confere os artefatos
        run: |
          pip install twine
          twine check dist/*
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    # Num workflow_dispatch o GITHUB_REF_NAME é o branch, não uma versão: aí o
    # run vira só um ensaio de testes + build, sem publicar nada.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Notas a partir do CHANGELOG
        run: |
          python - <<'PY' > NOTAS.md
          import pathlib, re
          v = "${{ needs.build.outputs.versao }}"
          texto = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"^## \[{re.escape(v)}\].*?$(.*?)(?=^## \[|\Z)", texto, re.S | re.M)
          corpo = m.group(1).strip() if m else "Veja o CHANGELOG.md."
          # o rodapé do CHANGELOG define os links [versao]: url; eles não são nota
          linhas = corpo.split("\n")
          while linhas and (re.match(r"^\[[^\]]+\]:\s", linhas[-1]) or not linhas[-1].strip()):
              linhas.pop()
          print("\n".join(linhas))
          tag = "v" + v
          whl = f"mkqr-{v}-py3-none-any.whl"
          base = "https://github.com/berodcdev/mkqr/releases/download"
          print("\n## Instalação\n")
          print(f"```sh\npipx install mkqr=={v}\n```\n")
          print("Sem o PyPI, direto daqui:\n")
          print(f"```sh\npipx install {base}/{tag}/{whl}\n```")
          PY
          cat NOTAS.md
      - name: Publica o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file NOTAS.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file NOTAS.md \
              --verify-tag
          fi

  pypi:
    name: PyPI
    needs: build
    # Só publica quando a variável do repositório PUBLISH_TO_PYPI for "true".
    # Até o Trusted Publisher existir do lado do PyPI, este job é pulado e a tag
    # continua gerando o GitHub Release normalmente.
    #   gh variable set PUBLISH_TO_PYPI --body true
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mkqr/
    permissions:
      id-token: write   # Trusted Publishing (OIDC): sem token guardado no repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
