<text x="18" y="229" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">  </tspan><tspan fill="#e6e6e6" font-weight="bold" xml:space="preserve">QR codes pela linha de comando, sem fricção.</tspan><tspan fill="#e6e6e6" xml:space="preserve">  </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve">v0.1.3</tspan></text>
