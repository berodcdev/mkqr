<text x="18" y="286" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">https://example.com</tspan><tspan fill="#e6e6e6" xml:space="preserve">                              </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># mostra o QR aqui no terminal</tspan></text>
<text x="18" y="305" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">https://example.com -O site.png</tspan><tspan fill="#e6e6e6" xml:space="preserve">                  </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># salva PNG recortado e transparente</tspan></text>
<text x="18" y="324" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">https://example.com -O ~/Documents/</tspan><tspan fill="#e6e6e6" xml:space="preserve">              </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># salva com nome automático</tspan></text>
<text x="18" y="343" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">https://example.com -c</tspan><tspan fill="#e6e6e6" xml:space="preserve">                           </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># copia PNG para o clipboard</tspan></text>
<text x="18" y="362" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">https://example.com -O site.png --logo logo.png</tspan><tspan fill="#e6e6e6" xml:space="preserve">  </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># logo no centro</tspan></text>
<text x="18" y="381" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">--wifi MinhaRede -p senha -O ./</tspan><tspan fill="#e6e6e6" xml:space="preserve">                  </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># QR que conecta no Wi-Fi</tspan></text>
<text x="18" y="400" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#ffd75f" xml:space="preserve">--vcard &#x27;Ana Lima&#x27; --phone +55...</tspan><tspan fill="#e6e6e6" xml:space="preserve">                </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># QR de contato</tspan></text>
<text x="18" y="438" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">  </tspan><tspan fill="#ff87ff" font-weight="bold" xml:space="preserve">Mais</tspan></text>
<text x="18" y="457" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#5fd7d7" xml:space="preserve">-h</tspan><tspan fill="#e6e6e6" xml:space="preserve">                    </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># todas as opções: cores, SVG/PDF, vCard, margem...</tspan></text>
<text x="18" y="476" xml:space="preserve"><tspan fill="#e6e6e6" xml:space="preserve">    </tspan><tspan fill="#87d787" font-weight="bold" xml:space="preserve">mkqr</tspan><tspan fill="#e6e6e6" xml:space="preserve"> </tspan><tspan fill="#5fd7d7" xml:space="preserve">--install-completion</tspan><tspan fill="#e6e6e6" xml:space="preserve">  </tspan><tspan fill="#e6e6e6" opacity="0.55" xml:space="preserve"># Tab completa flags, cores, arquivos e redes Wi-Fi</tspan></text>
